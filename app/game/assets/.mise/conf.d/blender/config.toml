[tools]
"aqua:blender/blender" = "5.2.2"

[tasks.blender]
description = "Avvia Blender"
run = "blender"

[tasks."build:deep_space_freighter"]
description = "Rigenera il blockout P0 dalle reference ortografiche mantenendo attiva la collection Reference"
run = "blender -b ships/deep_space_freighter/deep_space_freighter.blend --python ships/deep_space_freighter/scripts/03_genera_geometria.py"

[tasks."export:deep_space_freighter-reference"]
description = "Esporta la reference piana nave in OBJ/MTL/PNG"
run = "blender -b ships/deep_space_freighter/deep_space_freighter.blend --python ships/deep_space_freighter/scripts/04_esporta_reference_obj.py"

[tasks."reference:deep_space_freighter"]
description = "Rimuove le GEO e allinea le quattro reference ortografiche nel file Blender della nave"
run = "blender -b ships/deep_space_freighter/deep_space_freighter.blend --python ships/deep_space_freighter/scripts/02_inserisci_references.py"
