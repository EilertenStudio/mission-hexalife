<svg xmlns="http://www.w3.org/2000/svg" width="320" height="288" viewBox="0 0 320 288" shape-rendering="crispEdges">
  <defs>
    <pattern id="floor-tiles" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="32" height="32" fill="#a99d6a"/>
      <path d="M0 0H32 M0 0V32" fill="none" stroke="#958b60" stroke-width="2"/>
      <path d="M16 4V12 M22 24H28" stroke="#b8ad75" stroke-width="2"/>
    </pattern>
    <pattern id="wall-blocks" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="16" fill="#47563b"/>
      <path d="M0 1H32 M0 15H32 M16 1V8 M0 8H32 M8 8V15" fill="none" stroke="#374632" stroke-width="2"/>
      <rect x="4" y="3" width="8" height="2" fill="#647148"/>
      <rect x="20" y="10" width="8" height="2" fill="#647148"/>
    </pattern>
    <pattern id="base-grid-16" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#203b32" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="320" height="288" fill="#302e25"/>
  <rect x="16" y="16" width="288" height="256" fill="#5a4a30"/>

  <!-- Pavimento uniforme e vuoto -->
  <rect x="32" y="32" width="256" height="224" fill="#a99d6a"/>
  <rect x="32" y="32" width="256" height="224" fill="url(#floor-tiles)"/>

  <!-- Parete nord -->
  <rect x="16" y="16" width="288" height="32" fill="url(#wall-blocks)"/>
  <path d="M16 48H304V56H16Z" fill="#756543"/>
  <path d="M16 48H304V52H16Z" fill="#a28b55"/>

  <!-- Pareti laterali -->
  <rect x="16" y="48" width="16" height="208" fill="url(#wall-blocks)"/>
  <rect x="288" y="48" width="16" height="208" fill="url(#wall-blocks)"/>
  <path d="M32 48V256H40V48Z M280 48V256H288V48Z" fill="#766543"/>

  <!-- Parete sud con varco aperto al centro -->
  <rect x="16" y="256" width="112" height="16" fill="url(#wall-blocks)"/>
  <rect x="160" y="256" width="144" height="16" fill="url(#wall-blocks)"/>
  <rect x="16" y="272" width="112" height="16" fill="#302e25"/>
  <rect x="160" y="272" width="144" height="16" fill="#302e25"/>
  <path d="M120 248H168V256H120Z" fill="#756543"/>
  <path d="M128 240H160V256H128Z" fill="#d4c17a"/>
  <path d="M128 252H160V256H128Z" fill="#eadb98"/>
  <path d="M120 256H128V272H120Z M160 256H168V272H160Z" fill="#85613c"/>
  <path d="M124 260H128V272H124Z M160 260H164V272H160Z" fill="#bd8a4b"/>
  <path d="M128 256H160" stroke="#453b2a" stroke-width="2"/>

  <!-- Livello guida facoltativo della griglia 16x16 -->
  <g id="base-grid-guide-16x16" visibility="hidden" pointer-events="none">
    <rect width="320" height="288" fill="url(#base-grid-16)"/>
  </g>
</svg>
