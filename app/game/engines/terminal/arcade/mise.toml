[tools]
node = "24.16.0"

[env]
npm_config_cache = "{{ config_root }}/../../../../../.local/npm/cache"

[tasks.play]
description = "Avvia cryogenic-room in Arcade"
dir = "{{ config_root }}"
run = "set -e; if [ ! -d node_modules/ascii-arcade ]; then npm ci --ignore-scripts --no-audit --no-fund; fi; node main.mjs"

[tasks."play:cryogenic-room"]
description = "Avvia la sala criogenica importata da Blender"
dir = "{{ config_root }}"
run = "set -e; if [ ! -d node_modules/ascii-arcade ]; then npm ci --ignore-scripts --no-audit --no-fund; fi; node main.mjs cryogenic-room"
