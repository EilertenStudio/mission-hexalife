[tools]
node = "24.16.0"

[env]
npm_config_cache = "{{ config_root }}/../../../../../.local/npm/cache"

[tasks.play]
description = "Avvia la schermata vuota di Arcade nel terminale"
dir = "{{ config_root }}"
run = "set -e; if [ ! -d node_modules/ascii-arcade ]; then npm ci --ignore-scripts --no-audit --no-fund; fi; node main.mjs"
