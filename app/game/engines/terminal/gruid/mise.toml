[tools]
# Gruid è una libreria Go; i moduli applicativi si dichiarano nel go.mod.
go = "1.27.2"

[env]
GOPATH = "{{ config_root }}/../../../../../.local/go"
GOCACHE = "{{ config_root }}/../../../../../.local/go/cache"

[tasks.play]
description = "Gioca a Tre stelle nel terminale"
dir = "{{ config_root }}"
run = "go run ."
